<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Test checkout — {{ranch}}</title>
<meta name="robots" content="noindex">
<script type="module" src="/js/dev-checkout.js?v={{v}}"></script>
</head>
<body>
<!--#header-->
<main id="main" class="app-main" tabindex="-1">
  <div class="wrap">
    <div class="auth-card panel">
      <p class="eyebrow">Development only</p>
      <h1>Test checkout</h1>
      <p>This page stands in for Stripe while the site runs without payment keys. In production, guests go to Stripe’s secure checkout instead, and this page does not exist.</p>
      <div class="alert error" id="dev-error" role="alert" hidden></div>
      <div class="row-actions">
        <button class="btn" type="button" id="pay">Simulate successful payment</button>
        <button class="btn secondary" type="button" id="cancel">Cancel</button>
      </div>
    </div>
  </div>
</main>
<!--#footer-->
</body>
</html>
