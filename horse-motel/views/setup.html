<!doctype html>
<html lang="en">
<head>
<!--#head-->
<title>Create your password — {{ranch}}</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script type="module" src="/js/setup.js?v={{v}}"></script>
</head>
<body>
<!--#header-->
<main id="main" class="app-main" tabindex="-1">
  <div class="wrap">
    <div class="auth-card panel">
      <h1 id="setup-title" tabindex="-1">Create your password</h1>
      <p id="setup-loading" role="status">Checking your link…</p>
      <div class="alert error" id="setup-invalid" role="alert" hidden></div>
      <form id="setup-form" novalidate hidden>
        <p id="setup-intro" class="muted"></p>
        <div class="field">
          <label for="acct-email">Your account</label>
          <input type="email" id="acct-email" autocomplete="username" readonly>
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="12" maxlength="128" aria-describedby="pw-hint">
          <p class="hint" id="pw-hint">At least 12 characters. A short phrase of 3–4 words is easy to remember and hard to guess.</p>
        </div>
        <div class="field">
          <label for="password2">Type it again</label>
          <input type="password" id="password2" autocomplete="new-password" required maxlength="128">
        </div>
        <div class="check">
          <input type="checkbox" id="show-pw">
          <label for="show-pw">Show passwords</label>
        </div>
        <div class="alert error" id="setup-error" role="alert" hidden></div>
        <button class="btn block" type="submit">Save password</button>
      </form>
    </div>
  </div>
</main>
<!--#footer-->
</body>
</html>
