# MediaMTX configuration for Rockin' C Ranch stall cameras.
#
# Runs on the WEB SERVER, next to the site. It pulls each camera's stream from the ranch
# over Tailscale only while someone is watching (sourceOnDemand), repackages it as HLS,
# and serves it on 127.0.0.1 only: the site's camera relay is its only client.
#
# 1. Replace NVR_IP, NVR_USER and NVR_PASSWORD below (Reolink NVR: Settings → Network →
#    Advanced → Port Settings: make sure RTSP is ON).
# 2. Keep one path per stall; delete the ones you don't have.
# 3. Then run:  npm run cameras:setup  (adds the 8 cameras to the site, mapped to stalls)

logLevel: warn

# Only HLS is needed. Everything else is off, so nothing extra listens on the server.
rtsp: no
rtmp: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
playback: no

hls: yes
hlsAddress: 127.0.0.1:8888      # never exposed to the internet; only the site reads it
hlsVariant: fmp4                # standard HLS; plays in Safari and via hls.js everywhere
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsAllowOrigin: ''

pathDefaults:
  sourceOnDemand: yes             # only pull from the ranch while a guest is watching
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 20s
  rtspTransport: tcp              # reliable over Tailscale / rural links

paths:
  # "_sub" is the NVR's low-bandwidth stream (about 0.5 Mbps). It's the right choice on a
  # rural upload connection. For sharper video with plenty of upload speed use "_main",
  # but only if the camera sends H.264 (browsers can't play H.265).
  stall1: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_01_sub }
  stall2: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_02_sub }
  stall3: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_03_sub }
  stall4: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_04_sub }
  stall5: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_05_sub }
  stall6: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_06_sub }
  stall7: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_07_sub }
  stall8: { source: rtsp://NVR_USER:NVR_PASSWORD@NVR_IP:554/h264Preview_08_sub }
